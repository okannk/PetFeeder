workflows:
  petfeeder-ios:
    name: PetFeeder iOS (İmzasız IPA)
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      flutter: stable

    scripts:
      - name: Flutter bağımlılıkları kur
        script: |
          cd mobile
          flutter pub get

      - name: iOS platform klasörünü oluştur
        script: |
          cd mobile
          if [ ! -d "ios" ]; then
            flutter create . --platforms=ios --org com.okan --project-name petfeeder
          fi
          # CocoaPods
          cd ios && pod install --repo-update && cd ..

      - name: Kod imzalamayı devre dışı bırak
        script: |
          PBXPROJ="mobile/ios/Runner.xcodeproj/project.pbxproj"

          # Flutter pre-check için DEVELOPMENT_TEAM boş olmayan sahte değer gerekiyor.
          # Boş bırakılırsa Flutter build'i hiç başlatmıyor (--no-codesign ile bile).
          # "LOCAL0BUILD" formatı geçerli ama var olmayan bir Team ID — gerçek signing olmaz.
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "LOCAL0BUILD";/g' "$PBXPROJ"

          # DEVELOPMENT_TEAM hiç yoksa ekle
          if ! grep -q "DEVELOPMENT_TEAM" "$PBXPROJ"; then
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET/DEVELOPMENT_TEAM = "LOCAL0BUILD";\n\t\t\t\tIPHONEOS_DEPLOYMENT_TARGET/g' "$PBXPROJ"
            echo "DEVELOPMENT_TEAM eklendi"
          fi

          # Auto-signing kapat — sahte Team ID ile provisioning profile arama (başarısız olur)
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' "$PBXPROJ"

          # Gerçek code signing kapat
          sed -i '' 's/CODE_SIGNING_REQUIRED = [^;]*;/CODE_SIGNING_REQUIRED = NO;/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGNING_ALLOWED = [^;]*;/CODE_SIGNING_ALLOWED = NO;/g' "$PBXPROJ"

          echo "Signing yapılandırması:"
          grep -E "DEVELOPMENT_TEAM|CODE_SIGNING|ProvisioningStyle" "$PBXPROJ" | head -15

      - name: Info.plist — izinler
        script: |
          PLIST="mobile/ios/Runner/Info.plist"

          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool YES" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool YES" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'PetFeeder cihazini yerel ag uzerinden kurmak icin gereklidir.'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string '_http._tcp'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string 'fetch'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName PetFeeder" "$PLIST" 2>/dev/null || true

      - name: iOS release build (imzasız)
        script: |
          cd mobile
          flutter build ios --release --no-codesign || true

          # Flutter wrapper exit 1 verir ama Xcode build tamamlandı.
          # Tam Runner.app (Runner binary dahil) DerivedData'da duruyor.
          DERIVED=$(find ~/Library/Developer/Xcode/DerivedData \
            -name "Runner.app" \
            -path "*/Release-iphoneos/*" \
            ! -path "*/Index.noindex/*" \
            2>/dev/null | head -1)

          echo "DerivedData Runner.app: $DERIVED"

          if [ -n "$DERIVED" ] && [ -f "$DERIVED/Runner" ]; then
            echo "✓ DerivedData'da tam Runner.app bulundu"
            mkdir -p build/ios/iphoneos
            cp -r "$DERIVED" build/ios/iphoneos/Runner.app
          else
            # Yerel build dizinini de dene
            LOCAL=$(find build/ios -name "Runner.app" -type d 2>/dev/null | head -1)
            echo "Yerel Runner.app: $LOCAL"
            if [ -n "$LOCAL" ] && [ -f "$LOCAL/Runner" ]; then
              echo "✓ Yerel build'de Runner.app bulundu"
              mkdir -p build/ios/iphoneos
              cp -r "$LOCAL" build/ios/iphoneos/Runner.app
            else
              echo "ERROR: Runner binary içeren Runner.app bulunamadı!"
              echo "--- DerivedData taraması ---"
              find ~/Library/Developer/Xcode/DerivedData -name "Runner" -not -name "*.app" 2>/dev/null | head -10
              echo "--- build/ios taraması ---"
              find build/ios -name "Runner" -not -name "*.app" 2>/dev/null | head -10
              exit 1
            fi
          fi

          echo "✓ Runner.app: $(du -sh build/ios/iphoneos/Runner.app | cut -f1)"

      - name: IPA paketle
        script: |
          mkdir -p mobile/build/ios/ipa/Payload
          cp -r "mobile/build/ios/iphoneos/Runner.app" "mobile/build/ios/ipa/Payload/"
          cd mobile/build/ios/ipa
          zip -r PetFeeder.ipa Payload
          echo "✓ IPA: $(du -sh PetFeeder.ipa)"

    artifacts:
      - mobile/build/ios/ipa/PetFeeder.ipa
