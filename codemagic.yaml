workflows:
  petfeeder-ios:
    name: PetFeeder iOS (İmzasız IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Flutter bağımlılıkları kur
        script: |
          cd mobile
          flutter pub get

      - name: iOS platform klasörünü oluştur
        script: |
          cd mobile
          if [ ! -d "ios" ]; then
            flutter create . --platforms=ios --org com.okan --project-name petfeeder
          fi
          # CocoaPods
          cd ios && pod install --repo-update && cd ..

      - name: Kod imzalamayı devre dışı bırak
        script: |
          PBXPROJ="mobile/ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGNING_REQUIRED = [^;]*;/CODE_SIGNING_REQUIRED = NO;/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGNING_ALLOWED = [^;]*;/CODE_SIGNING_ALLOWED = NO;/g' "$PBXPROJ"
          echo "Signing devre dışı bırakıldı."

      - name: Info.plist — izinler
        script: |
          PLIST="mobile/ios/Runner/Info.plist"

          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool YES" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool YES" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'PetFeeder cihazini yerel ag uzerinden kurmak icin gereklidir.'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string '_http._tcp'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string 'fetch'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName PetFeeder" "$PLIST" 2>/dev/null || true

      - name: iOS release build (imzasız)
        script: |
          cd mobile
          flutter build ios --release --no-codesign || true

          # Flutter'ın Xcode derleme çıktısı (post-build script çalışmasa da burası dolu)
          APP="build/ios/Release-iphoneos/Runner.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Runner.app hiç oluşmadı. Tüm build dizini:"
            find build -name "Runner.app" -type d 2>/dev/null
            exit 1
          fi

          # Post-build script signing hatasıyla durduysa Info.plist eksik olabilir
          # Kaynak Info.plist'i (PlistBuddy ile zaten düzeltilmiş) bundle'a kopyala
          if [ ! -f "$APP/Info.plist" ]; then
            echo "Info.plist eksik — ios/Runner/Info.plist kaynağından kopyalanıyor..."
            cp ios/Runner/Info.plist "$APP/Info.plist"
            echo "✓ Info.plist kopyalandı"
          fi

          echo "✓ Runner.app hazır: $(du -sh $APP | cut -f1)"
          ls -la "$APP/"

      - name: IPA paketle
        script: |
          APP="mobile/build/ios/Release-iphoneos/Runner.app"
          mkdir -p mobile/build/ios/ipa/Payload
          cp -r "$APP" mobile/build/ios/ipa/Payload/
          cd mobile/build/ios/ipa
          zip -r PetFeeder.ipa Payload
          echo "✓ IPA: $(du -sh PetFeeder.ipa)"

    artifacts:
      - mobile/build/ios/ipa/PetFeeder.ipa
